name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and regression suite
        run: npm run validate

      - name: Package and validate static release
        run: npm run package:release

      - name: Validate optional metrics collector
        run: python3 -m unittest discover -s tests -p "test_*metrics.py"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webmars-${{ github.sha }}
          path: |
            dist/webmars-*.zip
            dist/webmars-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: manual/package-lock.json

      - name: Install exact Manual dependencies
        run: npm ci

      - name: Build and validate the independent Manual
        run: npm run validate

      - name: Upload Manual site
        uses: actions/upload-artifact@v7
        with:
          name: webmars-manual-${{ github.sha }}
          path: manual/dist/
          if-no-files-found: error
          retention-days: 14

  mars-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install Java reference runtime
        run: sudo apt-get update && sudo apt-get install --yes default-jre-headless unzip
      - name: Fetch and verify pinned MARS 4.5
        run: npm run fetch:mars
      - name: Compare against MARS (reference required)
        env:
          WEBMARS_REQUIRE_MARS: "1"
        run: node --test tests/differential-mars.test.mjs
