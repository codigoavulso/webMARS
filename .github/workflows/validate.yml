name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and regression suite
        run: npm run validate

      - name: Package and validate static release
        run: npm run package:release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webmars-${{ github.sha }}
          path: |
            dist/webmars-*.zip
            dist/webmars-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
