# Include these locations inside the HTTPS `server` block that serves webMARS.
# They make stable example and publication links survive a direct navigation or
# browser refresh while preserving real 404 responses for missing static files.
# Required in /etc/nginx/mime.types (http scope):
#   application/javascript js mjs;
# The Manual imports .mjs modules. application/octet-stream makes browsers
# reject them and leaves the chapter navigation and content empty.

location ~ "^/(?:e/[a-z0-9][a-z0-9-]{0,79}|p/[a-z0-9]+(?:-[a-z0-9]+)*(?:@[1-9][0-9]*)?)/?$" {
    expires -1;
    try_files /index.html =404;
}

# The build number is part of the URL of packaged assets. Keep those responses
# fresh in the browser across visits. Unversioned resources still use validators.
location ~ "^/(?:assets|examples|help|libs|tools)/.+\.(?:asm|c|c0|css|gif|h|ico|jpg|js|json|pdf|png|txt)$" {
    set $webmars_asset_expiry -1;
    if ($arg_b ~ "^[0-9]{12}$") {
        set $webmars_asset_expiry 365d;
    }
    expires $webmars_asset_expiry;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ =404;
}

# For a subdirectory deployment, prefix both regular expressions and the
# index path with the configured appBasePath (for example `/mips/`).
