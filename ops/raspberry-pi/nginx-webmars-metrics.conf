# Include inside the webMARS HTTPS server block, before generic locations.
# The collector never receives forwarded IP/cookie/referrer headers.
location = /_metrics/heartbeat {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=webmars_metrics burst=100 nodelay;
    limit_req_status 429;
    client_max_body_size 128;
    client_body_buffer_size 128;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8766/heartbeat;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    add_header Cache-Control "no-store" always;
}

location = /_metrics/events {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=webmars_metrics burst=100 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    client_body_buffer_size 2k;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8766/events;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    add_header Cache-Control "no-store" always;
}

# Public, aggregate-only dashboard data. The collector returns no session IDs.
location = /_metrics/public {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=webmars_metrics burst=30 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8766/public;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
