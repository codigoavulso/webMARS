# Structured logging for webmars.nfiles.top.
# Installed into /etc/nginx/conf.d, which is loaded inside nginx's http block.

variables_hash_max_size 2048;

map $http_user_agent $webmars_is_bot {
    default 0;
    ~*(bot|crawler|spider|slurp|bingpreview|facebookexternalhit|facebookcatalog|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|googleother|curl|wget|python|aiohttp|go-http-client|headless|uptimerobot|statuscake|monitoring|agenticsearch|hnreader|readyou|link.?check|checker|palo.alto|cortex-xpanse|censys|leakix|l9scan|marginalia|netcraft|internetmeasurement|scanner|scan/|vuln_|cms-|productsnap|research|surveyagent|node|bun/|got) 1;
}

map "$request_method:$uri" $webmars_is_entry_request {
    default 0;
    ~^(GET|HEAD):/$ 1;
    ~^(GET|HEAD):/index\.html$ 1;
    "~^(GET|HEAD):/e/[a-z0-9][a-z0-9-]{0,79}/?$" 1;
    "~^(GET|HEAD):/p/[a-z0-9]+(?:-[a-z0-9]+)*(?:@[1-9][0-9]*)?/?$" 1;
}

map $http_sec_fetch_dest $webmars_is_browser_navigation {
    default 0;
    document 1;
}

log_format webmars_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"visit":"$webmars_visit_id",'
      '"usage_context":"$webmars_usage_context",'
      '"remote_addr":"$remote_addr",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_bytes":$request_length,'
      '"response_bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_version":"$server_protocol",'
      '"content_type":"$sent_http_content_type",'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"accept_language":"$http_accept_language",'
      '"fetch_dest":"$http_sec_fetch_dest",'
      '"fetch_mode":"$http_sec_fetch_mode",'
      '"fetch_site":"$http_sec_fetch_site",'
      '"connection_requests":$connection_requests,'
      '"browser_navigation":$webmars_is_browser_navigation,'
      '"is_bot":$webmars_is_bot'
    '}';

# Short-lived first-party correlation, never an account or persistent visitor ID.
map $cookie_webmars_visit $webmars_visit_id {
    "~^[a-f0-9]{32}$" $cookie_webmars_visit;
    default $request_id;
}
map $cookie_webmars_metrics_context $webmars_usage_context {
    internal internal;
    test test;
    default public;
}
map "$webmars_is_browser_navigation:$request_method:$status" $webmars_visit_cookie {
    default "";
    "~^1:(GET|HEAD):(200|304)$" "webmars_visit=$webmars_visit_id; Path=/; Max-Age=1800; SameSite=Lax; Secure";
}
