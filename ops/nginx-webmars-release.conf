# Include inside the HTTPS server. Install the webMARS package with
# scripts/deploy-release.sh, which switches current to a complete artifact atomically.
root /var/www/webmars-deploy/current;
index index.html;
open_file_cache off;

# ZIP entries use a fixed date. A same-length edit to mutable content must
# always reach old browsers, even when they supply the previous validators.
etag off;
if_modified_since off;
expires off;
add_header Cache-Control "no-store" always;

location = /build.json {
    try_files $uri =404;
}

location ~ "^/(?:e/[a-z0-9][a-z0-9-]{0,79}|p/[a-z0-9]+(?:-[a-z0-9]+)*(?:@[1-9][0-9]*)?)/?$" {
    try_files /index.html =404;
}

location ~ "^/(?:webmars-config\.js$|(?:assets|examples|help|libs|tools)/)" {
    # Only artifact IDs, never legacy display stamps, select immutable bytes.
    if ($arg_b ~ "^[a-f0-9]{64}$") {
        rewrite ^ /__webmars_release/$arg_b$uri last;
    }
    try_files $uri =404;
}

location ~ "^/__webmars_release/(?<webmars_id>[a-f0-9]{64})(?<webmars_asset>/(?:webmars-config\.js|(?:assets|examples|help|libs|tools)/.+))$" {
    internal;
    alias /var/www/webmars-deploy/releases/$webmars_id$webmars_asset;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    error_page 404 = @webmars_missing_asset;
}

location @webmars_missing_asset {
    return 404;
}

location / {
    try_files $uri $uri/ =404;
}
